<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pure Phaser 3 Custom Isometric</title>
  <style>
    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 20px #000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<script>
// The custom steep ratio (W = 32, H = 24). Standard 2:1 would be (32, 16)
const TILE_W = 32;
const TILE_H = 24; 

class MainScene extends Phaser.Scene {
  constructor() { super('MainScene'); }

  preload() {
    // ==========================================
    // ASSET SWAP LOCATION
    // To use real PNG assets, uncomment these and provide your paths:
    // ==========================================
    // this.load.image('floor', 'assets/kenney_iso_floor.png');
    // this.load.image('wall', 'assets/kenney_iso_wall.png');
    // this.load.spritesheet('player', 'assets/hero.png', { frameWidth: 16, frameHeight: 24 });
    
    // Fallback: Generate memory textures so this demo runs instantly
    this.generateTextures();
  }
  
  generateTextures() {
    // Floor Tile
    let ctx = this.textures.createCanvas('floor', 32, 24).context;
    ctx.fillStyle = '#3a4466'; ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(32,12); ctx.lineTo(16,24); ctx.lineTo(0,12); ctx.fill();
    ctx.fillStyle = '#262b44'; ctx.beginPath(); ctx.moveTo(16,2); ctx.lineTo(30,12); ctx.lineTo(16,22); ctx.lineTo(2,12); ctx.fill();
    this.textures.get('floor').refresh();

    // Wall Tile (Extruded height)
    ctx = this.textures.createCanvas('wall', 32, 48).context;
    ctx.fillStyle = '#8b5444'; ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(32,12); ctx.lineTo(16,24); ctx.lineTo(0,12); ctx.fill();
    ctx.fillStyle = '#6a3e31'; ctx.beginPath(); ctx.moveTo(0,12); ctx.lineTo(16,24); ctx.lineTo(16,48); ctx.lineTo(0,36); ctx.fill();
    ctx.fillStyle = '#502c21'; ctx.beginPath(); ctx.moveTo(16,24); ctx.lineTo(32,12); ctx.lineTo(32,36); ctx.lineTo(16,48); ctx.fill();
    this.textures.get('wall').refresh();

    // Player Sprite
    ctx = this.textures.createCanvas('player', 16, 24).context;
    ctx.fillStyle = '#ff4157'; ctx.fillRect(2, 8, 12, 16);
    ctx.fillStyle = '#ffcca5'; ctx.fillRect(3, 0, 10, 10);
    this.textures.get('player').refresh();
  }

  create() {
    this.collisionMap = new Set();
    
    // Build Floor Grid
    for (let x = -5; x < 5; x++) {
      for (let y = -5; y < 5; y++) {
        let pos = this.getScreenXY(x, y);
        let tile = this.add.image(pos.x, pos.y, 'floor');
        tile.setOrigin(0.5, 0.5);
        tile.depth = pos.y - 100; // Floor stays safely behind Y-sorted entities
      }
    }

    // Add Walls
    this.addWall(-2, -2);
    this.addWall(1, -3);
    this.addWall(1, -2);

    // Setup Player using logical coordinates (isoX, isoY)
    this.player = {
      isoX: 0,
      isoY: 0,
      sprite: this.add.sprite(0, 0, 'player')
    };
    
    // CRITICAL: Anchor sprites at the bottom-center (their feet) for accurate depth sorting
    this.player.sprite.setOrigin(0.5, 1); 

    this.cursors = this.input.keyboard.createCursorKeys();
    this.cameras.main.setZoom(2);
  }

  addWall(isoX, isoY) {
    let pos = this.getScreenXY(isoX, isoY);
    // Offset the Y rendering slightly because walls are taller than floor tiles
    let wall = this.add.image(pos.x, pos.y + 12, 'wall'); 
    wall.setOrigin(0.5, 1);
    wall.depth = pos.y; // Standard Y-Sorting logic
    this.collisionMap.add(`${isoX},${isoY}`);
  }

  // The core math projecting Cartesian grid to our custom steeper isometric screen
  getScreenXY(cartX, cartY) {
    return {
      x: (cartX - cartY) * (TILE_W / 2),
      y: (cartX + cartY) * (TILE_H / 2)
    };
  }

  update(time, delta) {
    const speed = 0.003 * delta;
    let dx = 0, dy = 0;

    if (this.cursors.left.isDown)  { dx -= 1; dy += 1; }
    if (this.cursors.right.isDown) { dx += 1; dy -= 1; }
    if (this.cursors.up.isDown)    { dx -= 1; dy -= 1; }
    if (this.cursors.down.isDown)  { dx += 1; dy += 1; }

    if (dx !== 0 || dy !== 0) {
      const length = Math.hypot(dx, dy);
      dx = (dx / length) * speed;
      dy = (dy / length) * speed;

      const nextX = this.player.isoX + dx;
      const nextY = this.player.isoY + dy;

      // Axis-separated wall sliding collision
      if (!this.collisionMap.has(`${Math.round(nextX)},${Math.round(this.player.isoY)}`)) {
        this.player.isoX = nextX;
      }
      if (!this.collisionMap.has(`${Math.round(this.player.isoX)},${Math.round(nextY)}`)) {
        this.player.isoY = nextY;
      }
    }

    // Apply logical coordinates to screen position
    const pos = this.getScreenXY(this.player.isoX, this.player.isoY);
    this.player.sprite.x = pos.x;
    this.player.sprite.y = pos.y;
    
    // Dynamic Depth Sorting
    this.player.sprite.depth = pos.y;

    this.cameras.main.centerOn(pos.x, pos.y - 24);
  }
}

new Phaser.Game({
  type: Phaser.WEBGL,
  width: 640, height: 360,
  pixelArt: true,
  scene: MainScene
});
</script>
</body>
</html>
